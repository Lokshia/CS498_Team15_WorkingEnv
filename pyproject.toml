[project]
name = "lifting-lab"
version = "0.4.0"
description = "Team simulation workspace for Booster K1 standing with a preheld chest-level load"
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
    "booster-mjlab==0.1.0",
    "mjlab==1.6.0",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.15.0",
    "rsl-rl-lib==5.5.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "viser==1.1.0",
    "mediapy==1.2.7",
    "tensordict==0.11.0",
    "tensorboard==2.20.0",
    "tyro==1.0.12",
    "onnx==1.21.0",
    "onnxscript==0.6.2",
]

[project.optional-dependencies]
cu130 = ["torch==2.11.0"]
cpu = ["torch==2.11.0"]

[build-system]
requires = ["uv_build==0.9.5"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.21"
conflicts = [[{ extra = "cu130" }, { extra = "cpu" }]]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
booster-mjlab = { git = "https://github.com/parasollab/cs498-booster-track", rev = "7c51db18821560cef4908964984488da7c946930", subdirectory = "course/hw3/vendor/booster_mjlab" }
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "b517e0c489139e7fcee95702cfb2b01931264985" }
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cpu", extra = "cpu" },
]
warp-lang = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true
